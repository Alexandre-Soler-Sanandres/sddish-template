name: harness-conformance

# Structural guard for the agent harness skeleton. This is NOT a substitute for the
# agent-performed COR-10-060 citation audit, Improvement validation, explicit approval,
# or human semantic review — it only catches cross-surface drift in the template.

on:
  # Only the surfaces the check scripts below actually read. `main` advances only
  # through merged PRs (already checked pre-merge), so there is no push trigger.
  pull_request:
    paths:
      - 'agent-harness/**'                           # harness source: modes, artifact-specs, systems, templates, docs, entrypoints.yaml
      - 'harness-data/**'                            # artifacts, CATALOG.md, reference/, HARNESS-PROFILE.yaml, playbooks/, guides/
      - 'scripts/**'                                 # check-harness-conformance.sh, check-harness.sh, render-harness-views.sh, generate-harness-wrappers.sh
      - 'AGENTS.md'                                  # root loader / citation root
      - 'CLAUDE.md'                                  # root loader / citation root
      - '.github/copilot-instructions.md'            # root loader / citation root
      - '.github/agents/**'                          # Copilot wrapper layer (generated from entrypoints.yaml)
      - '.claude/**'                                 # Claude Code wrapper layer (.claude/skills/harness/**)
      - '.agents/**'                                 # Codex CLI wrapper layer (.agents/skills/harness/**)
      - 'agents/**'                                  # generated Codex manifest (agents/openai.yaml) when present
      - '.github/workflows/harness-conformance.yml'  # re-run when the guard itself changes
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install wrapper-generator dependency
        run: python -m pip install PyYAML
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Run portable harness conformance
        run: bash scripts/check-harness-conformance.sh
      - name: Run full harness and data check
        run: bash scripts/check-harness.sh
      - name: Check generated Catalog cleanliness
        run: |
          bash scripts/render-harness-views.sh
          git diff --exit-code -- harness-data/CATALOG.md
